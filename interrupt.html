<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Calendar reminder</title>
  <link rel="stylesheet" href="terminal.css">
  <style>
    :root { font-size: 15px; }
    body { min-height: 100vh; display: grid; place-items: center; }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      border: 3px solid var(--red);
      box-shadow: inset 0 0 60px rgba(255, 59, 59, .35);
      animation: alert 1s steps(1) infinite;
    }
    #rain { opacity: .3; }
    main { width: min(90vw, 820px); padding: 24px; }

    .banner { display: flex; align-items: center; gap: 14px; margin: 0; color: var(--red); font-size: clamp(14px, 2.2vw, 20px); font-weight: 800; letter-spacing: .18em; text-shadow: 0 0 10px rgba(255, 59, 59, .7); }
    .banner .blink { animation: blink .7s steps(1) infinite; }
    .banner .clock { margin-left: auto; color: var(--green-dim); letter-spacing: .06em; text-shadow: none; font-weight: 700; }

    .event {
      margin: 18px 0 6px;
      min-height: 1.2em;
      color: var(--green);
      font-size: clamp(30px, 5.5vw, 64px);
      line-height: 1.15;
      overflow-wrap: anywhere;
      text-shadow: 0 0 14px rgba(51, 255, 102, .6);
    }
    .event::before { content: "> "; color: var(--green-dim); }
    .sub { margin: 0 0 26px; color: var(--green-dim); }

    .actions { display: grid; gap: 12px; }
    .run { padding: 16px; font-size: clamp(16px, 2.2vw, 20px); }
    .run kbd, .cmd kbd { margin-left: 10px; font: inherit; font-size: .75em; opacity: .7; }
    .cmd { width: 100%; padding: 12px; font-size: 14px; }
    .snooze-label { margin: 8px 0 0; color: var(--green-dim); font-size: 12px; letter-spacing: .08em; }
    .snooze-label::before { content: "// "; }
    .snooze-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .snooze { padding: 12px 6px; border: 1px solid var(--green-faint); background: var(--panel); color: var(--amber); font: inherit; font-weight: 800; cursor: pointer; }
    .snooze::before { content: "["; color: var(--green-dim); } .snooze::after { content: "]"; color: var(--green-dim); }
    .snooze:hover, .snooze:focus-visible { border-color: var(--amber); box-shadow: 0 0 10px rgba(255, 176, 0, .3); outline: none; }

    @keyframes alert { 50% { border-color: transparent; box-shadow: none; } }
    @media (prefers-reduced-motion: reduce) { body::before, .banner .blink { animation: none; } }
  </style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <main role="alert" aria-live="assertive">
    <p class="banner"><span class="blink">[!]</span> INCOMING MEETING <span class="clock" id="clock"></span></p>
    <h1 class="event" id="event-text">Calendar event</h1>
    <p class="sub">source: google calendar · signal intercepted</p>
    <div class="actions">
      <button class="run" id="dismiss" type="button">&gt; OPEN CALENDAR<kbd>[enter]</kbd></button>
      <button class="cmd" id="close" type="button">Close</button>
      <p class="snooze-label" id="snooze-label">snooze --remind-in</p>
      <div class="snooze-grid" aria-labelledby="snooze-label">
        <button class="snooze" type="button" data-snooze="30">30 sec</button>
        <button class="snooze" type="button" data-snooze="60">1 min</button>
        <button class="snooze" type="button" data-snooze="90">90 sec</button>
        <button class="snooze" type="button" data-snooze="120">2 min</button>
      </div>
    </div>
  </main>
  <script src="rain.js"></script>
  <script src="interrupt.js"></script>
</body>
</html>
