<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=440, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; color: white; background: radial-gradient(circle at 82% 5%, #3979c4 0, #173b66 48%, #102b4c 100%); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 22px; padding: 32px; }
    img { width: 112px; height: 112px; border-radius: 24px; filter: drop-shadow(0 15px 20px rgba(0,0,0,.28)); }
    h1 { margin: 0 0 8px; font-size: 31px; line-height: 1.02; letter-spacing: -.03em; }
    p { margin: 0; color: #d9e8fa; font-size: 16px; line-height: 1.35; font-weight: 650; }
    .pill { display: inline-block; margin-top: 16px; padding: 7px 12px; border-radius: 999px; color: #173b66; background: white; font-size: 12px; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <img src="../icons/icon-128.png" alt="">
    <div>
      <h1>Calendar Alarm</h1>
      <p>Google Calendar reminders that are difficult to miss.</p>
      <span class="pill">PRIVATE BY DESIGN</span>
    </div>
  </main>
</body>
</html>
